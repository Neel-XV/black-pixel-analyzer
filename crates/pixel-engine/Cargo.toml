[package]
name = "pixel-engine"
version = "0.1.0"
edition = "2021"
description = "WASM pixel analysis engine for Black Pixel Analyzer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# NOTE: [profile.release] removed from here — it was silently ignored by Cargo
# because profiles must be declared in the workspace root Cargo.toml (C8).

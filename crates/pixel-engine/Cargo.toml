[package]
name = "pixel-engine"
version = "0.1.0"
edition = "2021"
description = "WASM pixel analysis engine for Black Pixel Analyzer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Enable link-time optimisation for smaller WASM output
lto = true
# Optimise for size (s) or speed (3) — "s" is better for initial WASM bundle size
opt-level = "s"
# Abort on panic instead of unwinding — keeps WASM smaller
panic = "abort"

services:
  - type: web
    name: black-pixel-analyzer
    runtime: static
    buildCommand: |
      # Render ships Rust at /usr/local/cargo/bin but it is READ-ONLY.
      # Add it to PATH for rustc/cargo, then redirect CARGO_HOME so that
      # wasm-pack can be installed into a writable user directory.
      export PATH="/usr/local/cargo/bin:$PATH"
      rustup target add wasm32-unknown-unknown
      export CARGO_HOME="$HOME/.local/cargo"
      mkdir -p "$CARGO_HOME/bin"
      curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      export PATH="$CARGO_HOME/bin:$PATH"
      cd web
      npm ci
      npm run build
    staticPublishPath: web/dist
    pullRequestPreviewsEnabled: true
    headers:
      # Required for WASM modules to load correctly in all browsers
      - path: "/*"
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: "/*"
        name: Cross-Origin-Embedder-Policy
        value: require-corp
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: "/*"
        destination: /index.html

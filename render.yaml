services:
  - type: web
    name: black-pixel-analyzer
    runtime: static
    buildCommand: |
      # Render's /usr/local/cargo/bin is READ-ONLY — skip rustup re-install,
      # just add it to PATH for rustc/cargo.
      export PATH="/usr/local/cargo/bin:$PATH"
      rustup target add wasm32-unknown-unknown

      # The wasm-pack installer hardcodes /usr/local/cargo/bin and ignores
      # CARGO_HOME, so bypass it: download the prebuilt musl binary directly.
      mkdir -p "$HOME/bin"
      curl -sSL "https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz" \
        | tar -xz --strip-components=1 -C "$HOME/bin"
      chmod +x "$HOME/bin/wasm-pack"
      export PATH="$HOME/bin:$PATH"

      cd web
      npm ci
      npm run build
    staticPublishPath: web/dist
    pullRequestPreviewsEnabled: true
    headers:
      # Required for WASM modules to load correctly in all browsers
      - path: "/*"
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: "/*"
        name: Cross-Origin-Embedder-Policy
        value: require-corp
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: "/*"
        destination: /index.html

services:
  - type: web
    name: black-pixel-analyzer
    runtime: static
    buildCommand: |
      # Render ships Rust pre-installed at /usr/local/cargo/bin (read-only).
      # Skip the rustup installer — just add it to PATH, add the WASM target,
      # install wasm-pack, then build.
      export PATH="/usr/local/cargo/bin:$PATH"
      rustup target add wasm32-unknown-unknown
      curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      cd web
      npm ci
      npm run build
    staticPublishPath: web/dist
    pullRequestPreviewsEnabled: true
    headers:
      # Required for WASM modules to load correctly in all browsers
      - path: "/*"
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: "/*"
        name: Cross-Origin-Embedder-Policy
        value: require-corp
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: "/*"
        destination: /index.html
